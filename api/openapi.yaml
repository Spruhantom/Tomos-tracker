openapi: 3.1.0
info:
  title: TomOS Family API
  version: 0.1.0
  description: Draft contract. Only health routes exist in the current backend.
servers:
  - url: https://family.example.invalid/api/v1
security:
  - bearerAuth: []
paths:
  /accounts/guardians:
    post:
      summary: Register guardian account; verification and abuse controls required.
      security: []
      responses:
        "202": { description: Verification initiated }
  /families:
    post:
      summary: Create family group
      responses:
        "201": { description: Family created }
  /families/{familyId}/members:
    get:
      summary: List authorized family members
      parameters:
        - in: path
          name: familyId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Authorized family members }
  /devices/pairing-challenges:
    post:
      summary: Create short-lived single-use QR pairing challenge
      responses:
        "201": { description: Challenge created }
  /devices/pairing-challenges/{challengeId}/approve:
    post:
      summary: Child device explicitly approves pairing with its public key
      responses:
        "202": { description: Awaiting guardian confirmation }
  /devices/pairing-challenges/{challengeId}/confirm:
    post:
      summary: Guardian confirms pairing
      responses:
        "200": { description: Device paired }
  /members/{memberId}/location:
    put:
      summary: Submit authorized location fix
      parameters:
        - in: path
          name: memberId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude, accuracyMetres, recordedAt]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                accuracyMetres: { type: number, minimum: 0 }
                recordedAt: { type: string, format: date-time }
      responses:
        "202": { description: Accepted for authorized member }
  /families/{familyId}/alerts:
    get:
      summary: List authorized family alerts
      responses:
        "200": { description: Alerts }
  /members/{memberId}/sos:
    post:
      summary: Create SOS alert with latest available location
      responses:
        "202": { description: SOS accepted; delivery reported separately }
  /members/{memberId}/location-sharing:
    put:
      summary: Update visible location-sharing state
      responses:
        "200": { description: Sharing state updated }
  /health/live:
    get:
      security: []
      responses:
        "200": { description: Process alive }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
